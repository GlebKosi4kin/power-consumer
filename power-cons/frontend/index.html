<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мониторинг энергопотребления</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>&#9889; Мониторинг энергопотребления</h1>
    <span class="subtitle">Производственные линии &middot; </span>
    <nav>
      <a href="index.html" class="active">Дашборд</a>
      <a href="instructions.html">Инструкция</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </div>
</header>

<main>

  <section class="stats-grid">
    <div class="card stat-card">
      <div class="stat-label">Среднее за день</div>
      <div class="stat-value" id="stat-avg">&mdash;</div>
      <div class="stat-unit">МВт&middot;ч / час</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">Пиковое за день</div>
      <div class="stat-value" id="stat-peak">&mdash;</div>
      <div class="stat-unit">МВт&middot;ч</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">Итого за день</div>
      <div class="stat-value" id="stat-total">&mdash;</div>
      <div class="stat-unit">МВт&middot;ч</div>
    </div>
    <div class="card stat-card anomaly-card">
      <div class="stat-label">Аномалий за день</div>
      <div class="stat-value" id="stat-anomalies">&mdash;</div>
      <div class="stat-unit">выбросов</div>
    </div>
  </section>

  <section class="controls card">
    <label for="date-picker">Выберите дату:</label>
    <input type="date" id="date-picker"
           min="2026-01-01" max="2026-01-31" value="2026-01-15" />
    <button id="btn-load-day" class="btn">Показать день</button>
    <button id="btn-load-month" class="btn btn-secondary">Показать январь</button>
  </section>

  <section class="card chart-section" id="section-daily">
    <h2>Почасовое потребление</h2>
    <div class="chart-wrap">
      <canvas id="chart-daily"></canvas>
    </div>
  </section>

  <section class="card chart-section" id="section-monthly" style="display:none">
    <h2>Суточное потребление &mdash; январь 2026</h2>
    <div class="chart-wrap">
      <canvas id="chart-monthly"></canvas>
    </div>
  </section>

  <section class="card" id="section-anomalies">
    <h2>Аномальные выбросы</h2>
    <div id="anomaly-list" class="anomaly-list">
      <p class="empty-msg">Загрузка&#8230;</p>
    </div>
  </section>

</main>

<script src="js/dashboard.js"></script>
</body>
</html>
